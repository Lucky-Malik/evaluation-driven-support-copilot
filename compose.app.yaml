# Use with compose.yaml: docker compose -f compose.yaml -f compose.app.yaml ...
services:
  api:
    build: .
    image: support-copilot:0.5.0
    user: "${COPILOT_UID:-10001}:${COPILOT_GID:-10001}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-copilot}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./runs:/app/runs
  ui:
    image: support-copilot:0.5.0
    build: .
    command: ["copilot-ui", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      COPILOT_API_URL: http://api:8000
      COPILOT_RUNS_DIR: /app/runs
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./runs:/app/runs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
