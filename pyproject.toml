[project]
name = "support-copilot"
version = "0.2.0"
description = "Evaluation-driven technical support copilot: baseline RAG"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
copilot = "support_copilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL with pgvector; uses isolated schemas",
    "live: paid OpenAI calls; requires RUN_LIVE_TESTS=1 and OPENAI_API_KEY",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
